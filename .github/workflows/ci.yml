name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The release suites resolve historical commits (scripts/release/facts.ts),
      # so the whole history is needed, not the default single commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # _sql-to-paste/ is generated and never tracked; the paste-wrapper tests read it.
      - name: Release wrappers
        run: pnpm release:wrappers

      # Data tests run against PGlite, so no database service is needed. See ADR-0008.
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
